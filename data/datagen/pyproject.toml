[project]
name = "datagen"
version = "0.1.0"
description = "Synthetic deep-research task generation: core/ stage abstractions + domains/<name>/ pipelines."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.15", "pytest>=8.0"]
# Per-domain heavy deps as extras (chroma context-1-data-gen pattern):
sec = []      # e.g. edgar/sec parsers
indexing = []  # e.g. chromadb for indexing generated corpora
all = ["datagen[sec,indexing]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datagen"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501", "B008", "C901"]
