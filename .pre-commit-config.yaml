default_language_version:
    python: python3
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        args:
        -   --unsafe
    -   id: check-added-large-files
    -   id: check-xml
    -   id: check-toml
    -   id: check-json
    -   id: check-merge-conflict
    -   id: detect-aws-credentials
        args: [--allow-missing-credentials]
-   repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.8.0
    hooks:
    -   id: shellcheck
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.7.0
    hooks:
    -   id: pyupgrade
        args:
        - --py3-plus
        - --keep-runtime-typing
# Modern ruff scoped to apps/ and training/. Each sub-project's
# pyproject.toml supplies its own ruff config via per-file-style
# discovery. Version should match the one pinned in each sub-project's
# pyproject.toml dev extras.
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
    -   id: ruff
        files: ^(apps|training)/.*\.py$
        args: [--fix]
    -   id: ruff-format
        files: ^(apps|training)/.*\.py$
ci:
    autofix_commit_msg: 🎨 [pre-commit.ci] Auto format from pre-commit.com hooks
    autoupdate_commit_msg: ⬆ [pre-commit.ci] pre-commit autoupdate
