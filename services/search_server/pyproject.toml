[project]
name = "search-server"
version = "0.1.0"
description = "Tool/search HTTP service for the deep-research agent. Heavy retrieval deps isolated here."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.0,<3",
    "httpx>=0.27",
    # Heavy retrieval backends live HERE (never in libs/dr_agent):
    "rank-bm25>=0.2",
    # "faiss-cpu>=1.8",   # enable for dense retrieval
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
dense = ["faiss-cpu>=1.8", "sentence-transformers>=3.0"]

[project.scripts]
search-server = "search_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_server"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501", "B008", "C901"]
