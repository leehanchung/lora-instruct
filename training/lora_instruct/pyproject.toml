[project]
name = "lora-instruct"
version = "0.1.0"
description = "LoRA SFT training recipe (HuggingFace PEFT + LoRA)"
authors = [{ name = "Han Lee", email = "lee.hanchung@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.11.0",
    "transformers>=5.0.0",
    "peft>=0.19.0",
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.0",
    "datasets>=4.8.0",
    "sentencepiece>=0.2.0",
    "loralib>=0.1.2",
    "einops>=0.8.0",
    "fire>=0.7.0",
    "python-dotenv>=1.2.0",
    "wandb>=0.26.0",
]

# Inference/serving extras are not needed to train. Install with:
#   uv sync --extra inference
[project.optional-dependencies]
inference = [
    "vllm>=0.20.0",
    "openai>=2.33.0",
    "tiktoken>=0.12.0",
    "num2words>=0.5.14",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.0",
]

[tool.uv]
# App/scripts project (entry point is finetune.py), not an installable library.
package = false

[tool.pytest.ini_options]
# Make the local `utils` package importable in tests without packaging.
pythonpath = ["."]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
