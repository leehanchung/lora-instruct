[tool.poetry]
name = "lora-instruct"
version = "0.1.0"
description = ""
authors = ["Han Lee <lee.hanchung@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "utils"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
sentencepiece = "^0.2.0"
accelerate = "^1.13.0"
loralib = "^0.1.2"
bitsandbytes = "^0.49.0"
datasets = "^4.8.0"
fire = "^0.7.0"
peft = "^0.19.0"
transformers = "^5.0.0"
einops = "^0.8.0"
python-dotenv = "^1.2.0"
wandb = "^0.26.0"
vllm = "^0.20.0"
openai = "^2.33.0"
tiktoken = "^0.12.0"
num2words = "^0.5.14"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.2.0"
ipywidgets = "^8.1.0"
pytest = "^9.0.0"
ruff = "^0.15.0"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
