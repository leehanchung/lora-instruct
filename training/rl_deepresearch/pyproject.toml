[project]
name = "rl-deepresearch"
version = "0.1.0"
description = "Deep-research RL recipe — thin slime plugins (rollout + reward) over the dr-agent lib."
requires-python = ">=3.11"
# NOTE: megatron / sglang / slime are NOT listed here — they come from the
# slimerl/slime Docker image. This project only declares OUR light deps; the
# heavy engine is the container.
dependencies = [
    "dr-agent",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
dr-agent = { path = "../../libs/dr_agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugins"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501", "B008", "C901"]
